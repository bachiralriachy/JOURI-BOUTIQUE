<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF4D9" />
      <stop offset="25%" stop-color="#E5C78E" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="75%" stop-color="#A5855A" />
      <stop offset="100%" stop-color="#6F532A" />
    </linearGradient>

    <linearGradient id="goldHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9C794A" />
      <stop offset="40%" stop-color="#DFBF86" />
      <stop offset="60%" stop-color="#FFF8E7" />
      <stop offset="80%" stop-color="#D3B176" />
      <stop offset="100%" stop-color="#7A5A2B" />
    </linearGradient>

    <radialGradient id="goldRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9EA" />
      <stop offset="45%" stop-color="#DFC087" />
      <stop offset="75%" stop-color="#B89665" />
      <stop offset="100%" stop-color="#735427" />
    </radialGradient>

    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24221F" />
      <stop offset="70%" stop-color="#171614" />
      <stop offset="100%" stop-color="#0E0D0C" />
    </radialGradient>

    <!-- Drop Shadow Filter for Haute Couture Depth -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Text Path for Arched Inscriptions -->
    <path id="textArcTop" d="M 95,250 A 155,155 0 0,1 405,250" fill="none" />
    <path id="textArcBottom" d="M 400,250 A 150,150 0 0,1 100,250" fill="none" />
  </defs>

  <!-- Deep Onyx Circular Medallion Background -->
  <circle cx="250" cy="250" r="240" fill="url(#darkBg)" />

  <!-- Outer Fine Guilloche & Beaded Rings -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#goldLinear)" stroke-width="2.5" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#goldHighlight)" stroke-width="1.2" stroke-dasharray="2.5 4" opacity="0.85" />
  <circle cx="250" cy="250" r="216" fill="none" stroke="url(#goldLinear)" stroke-width="2" />
  <circle cx="250" cy="250" r="162" fill="none" stroke="url(#goldHighlight)" stroke-width="1.8" />
  <circle cx="250" cy="250" r="156" fill="none" stroke="url(#goldLinear)" stroke-width="1" stroke-dasharray="1.5 3" opacity="0.7" />

  <!-- Cardinal Star Ornaments (North, South, East, West) -->
  <g fill="url(#goldLinear)">
    <!-- North -->
    <polygon points="250,23 252.5,29 258,30 252.5,31 250,37 247.5,31 242,30 247.5,29" />
    <!-- South -->
    <polygon points="250,463 252.5,469 258,470 252.5,471 250,477 247.5,471 242,470 247.5,469" />
    <!-- West -->
    <polygon points="30,250 36,247.5 37,242 38,247.5 44,250 38,252.5 37,258 36,252.5" />
    <!-- East -->
    <polygon points="470,250 464,247.5 463,242 462,247.5 456,250 462,252.5 463,258 464,252.5" />
  </g>

  <!-- Arched Typography: JOURI BOUTIQUE (Top) -->
  <text font-family="'Cinzel', 'Playfair Display', 'Baskerville', 'Georgia', serif" font-size="22" font-weight="700" letter-spacing="9" fill="url(#goldHighlight)">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      JOURI BOUTIQUE
    </textPath>
  </text>

  <!-- Arched Typography: HAUTE COUTURE · BEIRUT (Bottom) -->
  <text font-family="'Cinzel', 'Montserrat', 'Helvetica Neue', sans-serif" font-size="12" font-weight="600" letter-spacing="8" fill="url(#goldLinear)" opacity="0.95">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      HAUTE COUTURE · BEIRUT
    </textPath>
  </text>

  <!-- Royal Imperial Crown / Tiara Crest at Apex of Monogram -->
  <g transform="translate(250, 168)" filter="url(#goldGlow)">
    <!-- Crown Base Band -->
    <path d="M -46,16 Q 0,11 46,16 L 43,21 Q 0,16 -43,21 Z" fill="url(#goldHighlight)" />
    <!-- Pearls on crown base -->
    <circle cx="-32" cy="17" r="1.8" fill="#FFF9EA" />
    <circle cx="-16" cy="15" r="1.8" fill="#FFF9EA" />
    <circle cx="0" cy="14" r="2.2" fill="#FFF9EA" />
    <circle cx="16" cy="15" r="1.8" fill="#FFF9EA" />
    <circle cx="32" cy="17" r="1.8" fill="#FFF9EA" />

    <!-- Crown Filigree Spikes -->
    <!-- Center Peak -->
    <path d="M 0,-14 L 6,12 Q 0,10 -6,12 Z" fill="url(#goldRadial)" />
    <circle cx="0" cy="-16" r="3.2" fill="url(#goldHighlight)" stroke="#6F532A" stroke-width="0.5" />
    <circle cx="0" cy="-16" r="1.5" fill="#FFFFFF" />

    <!-- Left Main Peak -->
    <path d="M -26,-6 L -16,13 Q -24,12 -30,14 Z" fill="url(#goldLinear)" />
    <circle cx="-27" cy="-8" r="2.5" fill="url(#goldHighlight)" />

    <!-- Right Main Peak -->
    <path d="M 26,-6 L 30,14 Q 24,12 16,13 Z" fill="url(#goldLinear)" />
    <circle cx="27" cy="-8" r="2.5" fill="url(#goldHighlight)" />

    <!-- Far Left & Far Right Fleurons -->
    <path d="M -44,4 L -36,15 L -46,16 Z" fill="url(#goldLinear)" />
    <circle cx="-45" cy="2" r="2" fill="url(#goldHighlight)" />
    <path d="M 44,4 L 46,16 L 36,15 Z" fill="url(#goldLinear)" />
    <circle cx="45" cy="2" r="2" fill="url(#goldHighlight)" />
  </g>

  <!-- Central Intertwined Monogram "JB" (Pure Haute Couture Calligraphy) -->
  <g transform="translate(250, 252)">
    <!-- Letter J (Serif Teardrop & Graceful Stem) -->
    <!-- Top Serif of J -->
    <path d="M -75,-48 L -25,-48 L -25,-41 L -45,-41 L -45,-44 Z" fill="url(#goldHighlight)" />
    
    <!-- Graceful J Curve and Stem -->
    <path d="M -48,-46 C -48,-10 -46,45 -54,62 C -62,78 -78,84 -98,75 C -106,71 -110,64 -106,56 C -102,48 -94,49 -88,54 C -80,60 -70,58 -66,45 C -61,28 -60,-12 -60,-46 Z" fill="url(#goldRadial)" filter="url(#goldGlow)" />
    <!-- J terminal teardrop pearl -->
    <circle cx="-103" cy="58" r="4.5" fill="url(#goldHighlight)" />

    <!-- Letter B (Classical Roman Serif with Opulent Dual Bowls) -->
    <!-- B Main Vertical Stem with Serifs -->
    <!-- Top & Bottom Serifs of Stem -->
    <path d="M -16,-52 L 20,-52 L 20,-46 L 7,-46 L 7,52 L 24,52 L 24,58 L -16,58 L -16,52 L -3,52 L -3,-46 L -16,-46 Z" fill="url(#goldHighlight)" />

    <!-- B Top Bowl -->
    <path d="M 0,-49 C 32,-49 62,-44 62,-18 C 62,3 42,8 7,8 L 7,0 C 32,0 48,-4 48,-18 C 48,-32 28,-36 0,-36 Z" fill="url(#goldRadial)" filter="url(#goldGlow)" />

    <!-- B Bottom Bowl (Larger, Regal Proportion) -->
    <path d="M 0,2 C 42,2 74,6 74,34 C 74,61 40,65 0,65 L 0,55 C 28,55 58,52 58,34 C 58,16 28,12 0,12 Z" fill="url(#goldRadial)" filter="url(#goldGlow)" />

    <!-- Filigree Flourish Connecting J and B -->
    <path d="M -42,6 Q -15,18 0,4 Q 15,-10 32,-3" fill="none" stroke="url(#goldHighlight)" stroke-width="3" stroke-linecap="round" />
    <circle cx="-18" cy="14" r="2.8" fill="url(#goldLinear)" />
    <circle cx="16" cy="-6" r="2.2" fill="url(#goldLinear)" />
  </g>

  <!-- Botanical Emblem: Damascus "Jouri" Rose (وردة جورية) at Base -->
  <g transform="translate(250, 342)" filter="url(#goldGlow)">
    <!-- Laurel Wreath Leaves (Left) -->
    <g fill="url(#goldLinear)">
      <path d="M -18,12 C -32,10 -46,2 -56,-10 C -48,-4 -36,0 -24,4 Z" />
      <path d="M -35,16 C -50,18 -66,12 -78,2 C -68,6 -54,8 -42,8 Z" />
      <path d="M -52,24 C -68,30 -86,28 -98,20 C -88,22 -74,22 -60,18 Z" />
      <circle cx="-80" cy="1" r="2" fill="#FFF9EA" />
      <circle cx="-100" cy="19" r="2" fill="#FFF9EA" />
    </g>

    <!-- Laurel Wreath Leaves (Right) -->
    <g fill="url(#goldLinear)">
      <path d="M 18,12 C 32,10 46,2 56,-10 C 48,-4 36,0 24,4 Z" />
      <path d="M 35,16 C 50,18 66,12 78,2 C 68,6 54,8 42,8 Z" />
      <path d="M 52,24 C 68,30 86,28 98,20 C 88,22 74,22 60,18 Z" />
      <circle cx="80" cy="1" r="2" fill="#FFF9EA" />
      <circle cx="100" cy="19" r="2" fill="#FFF9EA" />
    </g>

    <!-- Center Blooming Jouri Rose Flower -->
    <!-- Outer Petals -->
    <path d="M 0,-14 C 14,-22 24,-10 20,4 C 16,16 0,22 -14,14 C -22,6 -18,-8 0,-14 Z" fill="url(#goldRadial)" opacity="0.9" />
    <!-- Mid Petals -->
    <path d="M -2,-8 C 8,-14 16,-6 12,3 C 8,11 -2,13 -10,7 C -15,1 -11,-6 -2,-8 Z" fill="url(#goldHighlight)" />
    <!-- Rose Heart Spiral -->
    <path d="M 0,-3 Q 5,-6 6,0 Q 6,5 1,5 Q -4,5 -3,1 Q -2,-2 1,-2" fill="none" stroke="#5E441D" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="0" cy="0" r="1.8" fill="#FFF9EA" />
  </g>
</svg>
