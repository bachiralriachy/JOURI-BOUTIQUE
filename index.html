<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Gracefully suppress dev-environment HMR WebSocket closure notifications in sandbox proxy
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && (event.reason ? (event.reason.message || String(event.reason)) : '');
        if (typeof reason === 'string' && (reason.indexOf('WebSocket') !== -1 || reason.indexOf('websocket') !== -1)) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event && (event.message || '');
        if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1)) {
          event.preventDefault();
        }
      });
    </script>
    <title>JOURI BOUTIQUE | Luxury Fashion & Haute Couture</title>
